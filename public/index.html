<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Google</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── HEADER ── -->
  <header>
    <nav class="nav-left">
      <a href="#">About</a>
      <a href="#">Store</a>
    </nav>

    <nav class="nav-right">
      <a href="#">Gmail</a>
      <a href="#">Images</a>

      <!-- Google Apps Icon (3×3 dots) -->
      <div class="apps-icon" title="Google apps">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM6 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM6 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/>
        </svg>
      </div>

      <a href="#" class="signin-btn">Sign in</a>
    </nav>
  </header>

  <!-- ── MAIN ── -->
  <main>

    
    <div class="logo">
  <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google">
</div>

    <!-- Search Box -->
    <div class="search-wrapper">
      <div class="search-box">

        <!-- Plus icon -->
        <button class="plus-btn" aria-label="Add">+</button>

        <!-- Input -->
        <input id="slug" class="search-input" type="text" autocomplete="off" aria-label="Search" />

        <!-- Right icons -->
        <div class="search-icons">

          <!-- Microphone -->
          <button class="icon-btn" aria-label="Search by voice">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
          </button>

          <!-- Camera / Lens -->
          <button class="icon-btn" aria-label="Search by image">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.65 0-3 1.35-3 3s1.35 3 3 3 3-1.35 3-3-1.35-3-3-3z"/>
            </svg>
          </button>

          <div class="divider"></div>

          <!-- AI Mode -->
          <button class="ai-mode-btn" aria-label="AI Mode">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" style="stop-color:#4285F4"/>
                  <stop offset="100%" style="stop-color:#EA4335"/>
                </linearGradient>
              </defs>
              <path fill="url(#aiGrad)" d="M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5L12 2zm0 10l1 3 3 1-3 1-1 3-1-3-3-1 3-1 1-3z"/>
            </svg>
            AI Mode
          </button>

        </div>
      </div>
    </div>

    <!-- Buttons -->
    <div class="search-buttons">
      <button>Google Search</button>
      <button>I'm Feeling Lucky</button>
    </div>

    <!-- Language Links -->
    <div class="language-section">
      <span>Google offered in:</span>
      <a href="#">हिन्दी</a>
      <a href="#">বাংলা</a>
      <a href="#">తెలుగు</a>
      <a href="#">मराठी</a>
      <a href="#">தமிழ்</a>
      <a href="#">ગુજરાતી</a>
      <a href="#">ಕನ್ನಡ</a>
      <a href="#">മലയാളം</a>
      <a href="#">ਪੰਜਾਬੀ</a>
    </div>

  </main>

  <!-- ── FOOTER ── -->
  <footer>
    <div class="footer-country">India</div>
    <div class="footer-links">
      <div class="footer-links-group">
        <a href="#">Advertising</a>
        <a href="#">Business</a>
        <a href="#">How Search works</a>
      </div>
      <div class="footer-links-group">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Settings</a>
      </div>
    </div>
  </footer>
  <script src="app.js"></script>

</body>
</html>
